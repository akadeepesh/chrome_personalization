<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
    <link rel="icon" href="icons/icon.png" />
    <!-- Applies the cached theme before first paint (no flash) and grabs focus from the address bar. -->
    <script src="js/boot.js"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app">
      <div class="clock" id="clock" hidden></div>

      <div class="search">
        <div class="bar">
          <span class="icon" id="barIcon" aria-hidden="true"></span>
          <input
            id="q"
            type="text"
            role="combobox"
            aria-label="Search or type a shortcut"
            aria-controls="results"
            aria-autocomplete="list"
            aria-expanded="false"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search, or type a shortcut…"
          />
        </div>
        <ul class="results" id="results" role="listbox" hidden></ul>
      </div>

      <section class="ai" id="ai" hidden aria-live="polite">
        <header>
          <span id="aiQuestion"></span>
          <button type="button" class="link" id="aiClose" aria-label="Close answer">Esc</button>
        </header>
        <div class="ai-body" id="aiBody"></div>
      </section>

      <nav class="tiles" id="tiles" aria-label="Pinned sites"></nav>
    </main>

    <button type="button" class="gear" id="openSettings" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>

    <dialog id="settings" aria-label="Settings"></dialog>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
